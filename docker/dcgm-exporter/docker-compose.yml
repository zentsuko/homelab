services:
  dcgm-exporter:
    container_name: dcgm-exporter
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    restart: unless-stopped

    ports:
      - "9400:9400"

    cap_add:
      - SYS_ADMIN

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
