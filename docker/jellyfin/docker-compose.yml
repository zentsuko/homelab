services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: always
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config
      - jellyfin-cache:/cache
      - /srv/media/movies:/movies
      - /srv/media/series:/series
      - /dev/dri:/dev/dri

volumes:
  jellyfin-cache:
    external: true
    name: a8e335af89cc4e86ecffcedf72e251511522a78d7620d2166299b750b474c512
