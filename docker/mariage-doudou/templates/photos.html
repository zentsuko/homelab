<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partager vos photos — Inès & Clément</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 1rem; display: grid; place-items: center; color: #302b27; background: linear-gradient(145deg, #e5d4c5, #d7e0d4 58%, #f1e8d9); font-family: Arial, sans-serif; }
    main { width: min(100%, 620px); padding: clamp(1.4rem, 5vw, 2.7rem); border-radius: 1.5rem; background: rgba(255, 253, 248, .94); box-shadow: 0 18px 50px #302b2725; text-align: center; }
    .eyebrow { color: #9a6a4f; font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: .7rem 0; font: 500 clamp(2.4rem, 9vw, 3.6rem) Georgia, serif; }
    p { color: #6c6259; line-height: 1.6; }
    button { width: 100%; margin-top: .8rem; padding: 1rem; border: 0; border-radius: .7rem; background: #9a6a4f; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    a { color: #86583f; }
    #status { min-height: 1.5rem; }
    progress { width: 100%; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">11 septembre 2027</div>
    <h1>Inès & Clément</h1>
    <p>Partagez avec nous les souvenirs de cette belle journée. Vous pouvez envoyer jusqu’à 20 photos à la fois.</p>
    <form id="upload-form">
      <label for="photo">Choisir des photos (JPG, PNG, HEIC ou WebP)</label>
      <input id="photo" name="photo" type="file" accept=".jpg,.jpeg,.png,.heic,.webp" multiple required>
      <button id="submit" type="submit">Envoyer les photos</button>
    </form>
    <progress id="progress" max="100" value="0" hidden></progress>
    <p id="status" role="status" aria-live="polite"></p>
    <p><a href="/">Retour au site du mariage</a></p>
  </main>
  <script>
    const form = document.getElementById("upload-form");
    const input = document.getElementById("photo");
    const submit = document.getElementById("submit");
    const status = document.getElementById("status");
    const progress = document.getElementById("progress");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (input.files.length < 1 || input.files.length > 20) {
        status.textContent = "Sélectionnez de 1 à 20 photos.";
        return;
      }
      const data = new FormData();
      for (const file of input.files) data.append("photo", file);
      submit.disabled = true;
      progress.hidden = false;
      status.textContent = "Envoi en cours…";
      try {
        const response = await fetch("/photos/upload", {method: "POST", body: data});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "L’envoi a échoué.");
        const params = new URLSearchParams();
        result.files.forEach((file) => params.append("files", file));
        window.location.href = `/photos/success?${params.toString()}`;
      } catch (error) {
        status.textContent = error.message;
        submit.disabled = false;
        progress.hidden = true;
      }
    });
  </script>
</body>
</html>
